name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [18, 22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
      - run: node scripts/validate.mjs
      - name: Package contents
        run: npm pack --dry-run

  # Single required check for branch rules; stays stable when the matrix changes.
  ci-ok:
    if: always()
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.validate.result }}" = "success"
